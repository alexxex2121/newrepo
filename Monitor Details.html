<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Details</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#f1f4f9;color:#1f2937;padding:24px}
.wrap{max-width:960px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px}
h1{margin:0;color:#1e3a5f;font-size:26px;letter-spacing:.5px;user-select:none}
.info{font-size:14px;color:#4b5563;margin-top:4px}
.btn{background:#2b5d8f;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600}
.btn:hover{background:#1e3a5f}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border:1px solid #9ca3af;padding:10px 12px;text-align:center;vertical-align:middle}
th{background:#1e3a5f;color:#fff;font-size:15px;letter-spacing:.3px}
td.type{font-weight:700;text-transform:uppercase;background:#f8fafc;width:26%}
td.name{font-weight:600;text-transform:uppercase;line-height:1.5}
tr:nth-child(even) td.name{background:#fbfcfe}
.note{font-size:13px;color:#6b7280;margin-top:12px;line-height:1.6}
@media print{
  body{background:#fff;padding:0}
  .no-print{display:none !important}
  .card{box-shadow:none;padding:0}
  .wrap{max-width:none}
  h1{font-size:22px}
  th{background:#ddd !important;color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td.type{background:#fff !important}
  tr:nth-child(even) td.name{background:#fff !important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">Monitors of the month</h1>
      <div class="info" id="info"></div>
    </div>
    <button class="btn no-print" id="printBtn">Print</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>MONITORS TYPE</th><th>MONITOR - 1</th><th>MONITOR - 2</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="note no-print">
    The names change automatically on the 1st of every month and stay the same for the whole month.
  </p>
</div>

<script>
/* ==========================================================
   CONTROL CENTRE - edit only here
   ========================================================== */

// Students in the monthly rotation (permanent monitors included).
const POOL = [
  "Shourya", "Florish", "Md. Yusuf", "Aarna", "Mahir", "Mishika", "Yash", "Anaisha",
  "Yashra", "Twinkal", "Kavya", "Ananya", "Aayat", "Avika", "Adab", "Dhriti", "Ruhi",
  "Yashi", "Ambiya", "Priyal", "Atharva Rastogi", "Aarush", "Yuvaan", "Manav"
];

// Rows of the table. "sizes" = how many students go in Monitor-1 and Monitor-2.
const ROWS = [
  { type: "Permanent",                sizes: [1, 1] },
  { type: "Temporary",                sizes: [1, 1] },
  { type: "Class Discipline",         sizes: [2, 2] },
  { type: "Soft Board Decoration",    sizes: [4, 4] },
  { type: "Compendium Decoration",    sizes: [4, 3] },
  { type: "Daily Almanac Incharge",   sizes: [1, 1] },
  { type: "Outer Board",              sizes: [1, 1] },
  { type: "Digi Board/Fan/AC",        sizes: [1, 1] },
  { type: "Line Incharge",            sizes: [2, 2] },
  { type: "English Speaking",         sizes: [3, 3] },
  { type: "Hindi Softboard",          sizes: [1, 1] },
  { type: "English Softboard",        sizes: [1, 1] },
  { type: "Maths Softboard",          sizes: [1, 1] },
  { type: "Science Softboard",        sizes: [1, 1] },
  { type: "Social Science Softboard", sizes: [1, 1] }
];

/* ========================================================== */

// Turns a text key into a number, so the same key always gives the same list.
function seedOf(text){
  let h = 2166136261;
  for(const ch of text){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(list, rand){
  const a = [...list];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Builds one list. Students with the fewest posts are picked first, so repeats stay low,
// and a student is never in both columns of the same row.
function buildList(key){
  const rand = mulberry32(seedOf(key));
  const order = shuffle(POOL, rand);
  const rank = {}, load = {};
  order.forEach((n, i) => { rank[n] = i; load[n] = 0; });

  return ROWS.map(row => {
    const cells = [[], []];
    const taken = new Set();
    for(let c = 0; c < 2; c++){
      for(let k = 0; k < row.sizes[c]; k++){
        const pick = order
          .filter(n => !taken.has(n))
          .sort((a, b) => (load[a] - load[b]) || (rank[a] - rank[b]))[0];
        taken.add(pick);
        load[pick]++;
        cells[c].push(pick);
      }
    }
    return { type: row.type, cells };
  });
}

// Current month, plus how many times the heading was clicked this month on this device.
function currentState(now){
  const month = now.getFullYear() + "-" + (now.getMonth() + 1);
  let n = 0;
  try{
    const s = JSON.parse(localStorage.getItem("monitor_shuffle"));
    if(s && s.month === month) n = s.n || 0;
  }catch(e){}
  return { month, n, key: month + "#" + n };
}

// Clicking the heading gives a new list for the rest of the month (on this device).
function shuffleNow(){
  const cur = currentState(new Date());
  try{ localStorage.setItem("monitor_shuffle", JSON.stringify({ month: cur.month, n: cur.n + 1 })); }catch(e){}
  render();
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
  const now = new Date();
  const monthName = now.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
  const nextChange = new Date(now.getFullYear(), now.getMonth() + 1, 1)
    .toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
  document.getElementById("info").textContent = "For " + monthName + "  |  Next change: " + nextChange;

  const list = buildList(currentState(now).key);
  document.getElementById("rows").innerHTML = list.map(r => `
    <tr>
      <td class="type">${esc(r.type)}</td>
      <td class="name">${r.cells[0].length ? r.cells[0].map(esc).join(", ") : "-"}</td>
      <td class="name">${r.cells[1].length ? r.cells[1].map(esc).join(", ") : "-"}</td>
    </tr>`).join("");
}

document.getElementById("title").addEventListener("click", shuffleNow);
document.getElementById("printBtn").addEventListener("click", () => window.print());
render();
</script>
</body>
</html>
